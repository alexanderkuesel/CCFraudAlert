services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fraudalert
      POSTGRES_PASSWORD: fraudalert
      POSTGRES_DB: fraudalert
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Published only so you can reach the DB from the host (psql, running the CLI locally).
    # The web and worker containers talk to it over the compose network on db:5432.
    # Defaults to 5433 to avoid clashing with a Postgres already running on the host.
    ports:
      - "127.0.0.1:${FRAUDALERT_DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudalert"]
      interval: 5s
      retries: 10
    restart: unless-stopped  # come back after a reboot, like web and worker

  web:
    build: .
    env_file: .env
    environment:
      FRAUDALERT_DATABASE_URL: postgresql+psycopg://fraudalert:fraudalert@db:5432/fraudalert
    ports:
      # FRAUDALERT_WEB_BIND=0.0.0.0 makes the UI reachable from other machines on your network
      # (the app then refuses to start unless FRAUDALERT_WEB_USERNAME/PASSWORD are set).
      - "${FRAUDALERT_WEB_BIND:-127.0.0.1}:${FRAUDALERT_WEB_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: ["fraudalert", "watch", "--interval", "300"]
    env_file: .env
    environment:
      FRAUDALERT_DATABASE_URL: postgresql+psycopg://fraudalert:fraudalert@db:5432/fraudalert
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
